services:
  rstudio-devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        ENABLE_SWITCH_USER: "true"
        USERNAME: rstudio
    container_name: rstudio-devcontainer
    image: alexfariakof/rstudio-dev-base:latest
    environment:
      PASSWORD: "toor"
      JUPYTER_TOKEN: "toor"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SPARK_MASTER: spark://spark-master:7077
    ports:
      - "8787:8787"
      - "8888:8888"
    volumes:
      - ..:/workspace:cached
      - ../.codex:/home/rstudio/.codex
      - vscode-extensions-shared:/home/rstudio/.vscode-server/extensions:rw
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp:unconfined
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:9864/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stdin_open: true
    tty: true
    networks:
      - rs-network
    logging:
      driver: json-file
      options:
        max-size: "10m"

volumes:
  vscode-extensions-shared:
    external: true

networks:
  rs-network:
    external: true