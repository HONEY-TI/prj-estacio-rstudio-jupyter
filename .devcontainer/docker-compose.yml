services:
  rstudio-devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: rstudio-devcontainer
    container_name: rstudio-devcontaier # docker exec -it rstudio-devcontaier bash
    environment:
      PASSWORD: "toor"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "8787:8787" # http://localhost:8787/ user: rstudio password: toor
      - "8888:8888" # http://localhost:8888/
    volumes:
      - ..:/workspaces:cached
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp:unconfined
    restart: unless-stopped
    #entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]    
    networks:
      - rs-network    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    
networks:
  rs-network:
    external: true

