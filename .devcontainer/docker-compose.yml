services:
  rstudio-devcontainer:
    container_name: rstudio-devcontainer
    image: rstudio-devcontainer:latest
    tty: true
    stdin_open: true 
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        ENABLE_SWITCH_USER: "true"
        USERNAME: rstudio
        WORKSPACE: /workspace
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN não definido no .env}
      XAUTHORITY: /tmp/.xauth-devc
      TZ: America/Sao_Paulo
      PASSWORD: "${RSTUDIO_PASSWORD:-toor}"
      JUPYTER_IP: "0.0.0.0"
      JUPYTER_PORT: "8888"
      JUPYTER_TOKEN: ""
      JUPYTER_PASSWORD_REQUIRED: "False"
      JUPYTER_ALLOW_ORIGIN: "*"
    env_file:
      - .env      
    ports:
      - "8787:8787"
      - "8888:8888"
    volumes:
      - ..:/workspace:cached
      - vscode-extensions-shared:/home/rstudio/.vscode-server/extensions:rw
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp:unconfined
    restart: unless-stopped
    networks:
      - rs-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  vscode-extensions-shared:
    external: true

networks:
  rs-network:
    external: true