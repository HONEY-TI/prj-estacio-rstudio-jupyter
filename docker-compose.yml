services:
  rstudio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rstudio-dev-base # docker exec -it rstudio-dev-base bash
    image: alexfariakof/rstudio-dev-base:latest
    environment:
      PASSWORD: "toor"
      # Spark
      SPARK_MASTER: spark://spark-master:7077
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    ports:
      - "8787:8787" # http://localhost:8787/ user: rstudio password: toor
      - "8888:8888" # http://localhost:8888/
    volumes:
      - ./workspace:/home/rstudio/workspace:cached
      - ./workspace:/workspace
      - vscode-extensions:/.vscode/extensions:/rstudio/.vscode-server/extensions
    restart: unless-stopped
    command: ["/usr/local/bin/docker-entrypoint.sh"]    
    networks:
      - spark-network    
    depends_on:
      spark-master:
        condition: service_started #ping -c 4 spark-master
      spark-worker:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  spark-master:
    container_name: spark-master
    image: apache/spark:3.5.1    
    environment:
      SPARK_NO_DAEMONIZE: "true"    
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_LOCAL_HOSTNAME: spark-master      
    hostname: spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../workspace:/workspace
    command: >
        /opt/spark/bin/spark-class
        org.apache.spark.deploy.master.Master
    mem_limit: 2g
    cpus: 2
    networks:
      - spark-network
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"

  spark-worker:
    container_name: spark-worker
    image: apache/spark:3.5.1
    environment:
      SPARK_MODE: worker
      SPARK_LOCAL_HOSTNAME: spark-worker
      SPARK_MASTER_URL: spark://spark-master:7077 #spark://localhost:7077      
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      PYSPARK_PYTHON: /opt/venv/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/venv/bin/python
    hostname: spark-worker
    ports:
      - "8081:8081"
    volumes:
      - ../workspace:/workspace
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    networks:
      - spark-network      
    depends_on:
      spark-master:
        condition: service_started #ping -c 4 spark-master
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"

volumes:
  vscode-extensions:

networks:
  spark-network:
    driver: bridge  